[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dge-optimizer"
version = "0.1.0"
description = "Denoised Gradient Estimation (DGE): Zeroth-Order Optimization via Block Perturbations and Temporal Filtering"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Mario Raúl Carbonell Martínez", email = "mcarbonell@github.com" }
]
keywords = [
    "optimization",
    "zeroth-order",
    "derivative-free",
    "deep-learning",
    "quantization",
    "spsa",
    "denoised-gradient"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
test = [
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]
all = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "matplotlib>=3.5.0",
    "pytest>=7.0.0",
    "psutil>=5.9.0",
]

[project.urls]
Homepage = "https://github.com/mcarbonell/dge-optimizer"
Repository = "https://github.com/mcarbonell/dge-optimizer"

[tool.setuptools.packages.find]
where = ["."]
include = ["dge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
